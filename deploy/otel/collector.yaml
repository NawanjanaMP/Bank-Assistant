receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }

processors:
  batch: {}
  memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
  # Defence in depth: strip any attribute that could carry message content.
  attributes/scrub:
    actions:
      - { key: http.request.body, action: delete }
      - { key: llm.prompt, action: delete }
      - { key: llm.completion, action: delete }
      - { key: enduser.id, action: hash }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/jaeger]
