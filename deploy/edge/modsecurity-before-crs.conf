# Runs before CRS initializes its defaults (REQUEST-901-INITIALIZATION.conf only sets
# tx.allowed_methods if it isn't already set), so this is the only hook point that can
# widen the method allowlist - the API uses DELETE for removing a conversation.
SecAction "id:900,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS DELETE'"
