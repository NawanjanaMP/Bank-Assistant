# CRS tuning for the chat API. Start in DetectionOnly in a new environment, review the audit
# log for false positives against real traffic, then switch to On (blocking).
SecRuleEngine On
SecRequestBodyLimit 16384
SecRequestBodyNoFilesLimit 16384

# Customers legitimately write things like "what's my balance; and my statement?" -
# relax the SQLi/command-injection paranoia only for the JSON `text` field of chat messages.
SecRule REQUEST_URI "@rx ^/v1/sessions/[a-f0-9]{32}/messages$" \
  "id:1000,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.text,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.text"

# Only JSON bodies are accepted by the API.
SecRule REQUEST_URI "@beginsWith /v1/" \
  "id:1001,phase:1,deny,status:415,chain,msg:'API accepts JSON only'"
  SecRule REQUEST_METHOD "@streq POST" "chain"
  SecRule REQUEST_HEADERS:Content-Type "!@beginsWith application/json"
