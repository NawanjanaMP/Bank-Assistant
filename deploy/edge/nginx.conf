# Edge Layer: WAF (ModSecurity + OWASP Core Rule Set), rate limits, API gateway routing.
#
# Volumetric DDoS protection belongs in front of this (Cloudflare / AWS Shield + CloudFront /
# Azure Front Door); this tier handles L7: request validation, per-IP limits, TLS, routing.
# Image: owasp/modsecurity-crs:nginx-alpine (ModSecurity module and CRS preloaded).

limit_req_zone  $binary_remote_addr zone=per_ip:20m       rate=20r/s;
limit_req_zone  $binary_remote_addr zone=chat_per_ip:20m  rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

upstream api { server orchestrator:8000; keepalive 32; }
upstream web { server web:8080; keepalive 8; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8443;
  server_tokens off;

  # In production terminate TLS here (or at the LB) with modern ciphers only:
  # listen 443 ssl http2; ssl_protocols TLSv1.2 TLSv1.3; ssl_certificate ...;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  modsecurity on;  # rules file is already wired into /etc/nginx/nginx.conf by this image's entrypoint

  client_max_body_size 16k;          # chat messages are small; reject oversized payloads early
  client_body_timeout 10s;
  client_header_timeout 10s;
  large_client_header_buffers 4 8k;
  limit_conn conn_per_ip 20;

  # Internal endpoints are never exposed through the edge.
  location ~ ^/(metrics|docs|openapi\.json|readyz) { return 404; }

  location = /v1/health { proxy_pass http://api/healthz; }

  # Chat turn: Server-Sent Events - no buffering, long read timeout, tighter limits.
  location ~ "^/v1/sessions/[a-f0-9]{32}/messages$" {
    limit_except POST { deny all; }
    limit_req zone=chat_per_ip burst=10 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
  }

  location /v1/ {
    limit_req zone=per_ip burst=40 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    limit_req zone=per_ip burst=80 nodelay;
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
