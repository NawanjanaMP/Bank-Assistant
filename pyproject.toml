[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bankai"
version = "1.0.0"
description = "Multi-agent conversational banking assistant (coordinator + specialist agents over MCP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=1.0",
  "openai>=1.50",
  "mcp>=2.2",
  "httpx>=0.27",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "PyJWT[crypto]>=2.9",
  "cryptography>=42",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.24",
  "lupa>=2.1",  # Lua scripting support for fakeredis EVAL (used by SessionStore.turn_lock)
  "aiosqlite>=0.20",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
bankai-orchestrator = "bankai.orchestrator.main:run"
bankai-mcp = "bankai.mcp_servers.__main__:main"
bankai-core-banking = "bankai.core_banking.mock_service:run"
bankai-eval = "bankai.evals.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bankai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"src/bankai/evals/*" = ["S106", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
