name: ci

on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "30 1 * * *" }]   # nightly model-quality evaluation

permissions: { contents: read }

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q
      - name: Agent evaluation (pipeline regression gate)
        run: bankai-eval --out eval-report.json
      - name: Security - static analysis and dependency audit
        run: |
          bandit -q -r src
          pip-audit
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: eval-report.json }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  images:
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.python -t bankai/python:${{ github.sha }} .
      - run: docker build -t bankai/web:${{ github.sha }} web
      - name: Scan images
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "bankai/python:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }

  model-eval:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'prompt-change')
    runs-on: ubuntu-latest
    environment: llm-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Agent evaluation against Claude, with LLM-as-judge
        env: { BANKAI_ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: bankai-eval --provider anthropic --judge --out eval-report-anthropic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report-anthropic, path: eval-report-anthropic.json }
