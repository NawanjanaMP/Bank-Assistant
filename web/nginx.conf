server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Strict CSP: only our own scripts; the IdP and API are the only network peers.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8080 https:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
  add_header Content-Security-Policy $csp always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp always;
  }

  location / {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy $csp always;
    try_files $uri /index.html;
  }
}
